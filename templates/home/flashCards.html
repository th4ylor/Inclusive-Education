<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../static/css/flashCards.css">
</head>
<body>
        <section>
            <div id="parag">
            </div>
                <header class="topbar">
            <a href="#" class="logo">
                <span><strong>SenFlow</strong><small>Educação Inclusiva</small></span>
            </a>
            <button  class="btnEntrar"> Sair </button>
                </header>
            <section id="inicio" class="inicio">
            
                <div class="textoInicial">
                    <span class="selo">Sala de estudos</span>
                    <h2>Pergunte,vire,<span class="grad">fixe.</span></h2>
            
                    <p class="subtitulo">Transforme o que você precisa estudar em um plano que realmente cabe no seu dia.<br> Com tempo para focar, respirar e continuar.</p>
                </div>
            </section>
            <main class="hero">
            
                <section >
                    <article class="flip" id="flashcard" tabindex="0" >
                    </article>
                    <article class="cards">
                        <button class="card Acerto" type="button" id="acertei">Acertei</button>
                        <button class="card Quase" type="button" id="quase">Quase</button>
                        <button class="card Erro" type="button" id="errei">Errei</button>
                    </article>
                </section>
                <section class="box">
                    <section class="sessao" >
                        <h1>Nesta sessão</h1>
                        <article>
                            <div class="acertos" id="innerAcerto" >
                                <h3 id="numeroAcerto">0</h3>
                                <small>Acertos</small>
                            </div>
                            <div class="quase" id="innerQuase">
                                <h3 id="numeroQuase">0</h3>
                                <small>Quase</small>
                            </div>
                            <div class="erros" id="innerErro">
                                <h3 id="numeroErro">0</h3>
                                <small>Erros</small>
                            </div>
                        </article>
                    </section>
                    <section class="cardaut">
                        <button type="submit">Gerar Cards com IA</button>
                    </section>
                    <section class="newFlash">
                        <form id="formCard" >
                            <h1>Novo FlashCard</h1>
                            <label for="materia">Matéria:</label>
                            <input type="text" id="materia" placeholder="Ex: Matemática">
                            <label for="pergunta">Pergunta:</label>
                            <input type="text" id="pergunta" placeholder="Oque voce quer lembrar?" required>
                            <label for="resposta">Resposta:</label>
                            <input type="text" id="resposta" placeholder="Resposta curta" required>
                            <button type="submit">Adicionar</button>
                        </form>
                    </section>
                </section>
            </main>
        </section>

        <script src="../../static/js/flashCards.js" defer></script>

</body>
</html>
